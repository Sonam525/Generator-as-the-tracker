# Stage-1 LoRA fine-tune (P0): frame -> ID-map perception on Cosmos3-Nano. Pinned.

base_model: "/Volumes/cornell_catalog/cornell_schema/blob_video/Generator is the tracker/models/cosmos3_nano"
out_dir: "/Volumes/cornell_catalog/cornell_schema/blob_video/Generator is the tracker/checkpoints/p0_stage1"

resolution: 1024            # square; frames + ID-maps resized to this (consistent distortion)
mask_source: filled_box     # filled_box | sam_pseudo (pseudo_masks.py later)
formulation: anchor         # anchor: num_frames=2, frame0=input anchored, generate frame1=ID-map
                            # (alt: vision_cond — encode frame as condition, generate ID-map directly)

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  targets: [to_q, to_k, to_v, to_out, gate_proj, up_proj, down_proj]

optim:
  lr: 1.0e-4
  steps: 3000
  batch_size: 1
  grad_accum: 4
  warmup: 100
  grad_checkpointing: true

# §8.4: without a preservation mix Stage-1 risks destroying the generative prior.
# Default 0 for the FIRST P0 run (flagged); raise to ~0.1-0.2 (self-distillation) if quality degrades.
preservation_mix: 0.0

seed: 0
save_every: 500
log_every: 25
