# Phase 3: PREFIX-CONDITIONED continuation training. Resume phase-2 step-1500, add an
# intrinsic prefix condition (p=0.5, temporal_boundary=2 latent frames = 9 pixel frames):
# teacher-forced 'continue this colouring' so chained windows can carry identity forward.
# Same data (phase2_train latents), same 25-video in-loop validation (unconditioned skill).
model:
  model_path: "/Volumes/cornell_catalog/cornell_schema/blob_video/Generator is the tracker/models/ltx2_native/model/ltx-2.3-22b-dev.safetensors"
  text_encoder_path: "/Volumes/cornell_catalog/cornell_schema/blob_video/Generator is the tracker/models/ltx2_native/gemma"
  training_mode: "lora"
  load_checkpoint: "/Volumes/cornell_catalog/cornell_schema/blob_video/Generator is the tracker/checkpoints/ltx_v2v_ic_lora_phase2/checkpoints/lora_weights_step_01500.safetensors"
lora:
  rank: 32
  alpha: 32
  dropout: 0.0
  target_modules:
    - "attn1.to_k"
    - "attn1.to_q"
    - "attn1.to_v"
    - "attn1.to_out.0"
    - "attn2.to_k"
    - "attn2.to_q"
    - "attn2.to_v"
    - "attn2.to_out.0"
    - "ff.net.0.proj"
    - "ff.net.2"
training_strategy:
  name: "flexible"
  video:
    is_generated: true
    latents_dir: "latents"
    conditions:
      - type: reference
        latents_dir: "reference_latents"
        probability: 1.0
      - type: prefix
        temporal_boundary: 2
        probability: 0.5
optimization:
  learning_rate: 2e-4
  steps: 3000
  batch_size: 1
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0
  optimizer_type: "adamw"
  scheduler_type: "constant"
  scheduler_params: {}
  enable_gradient_checkpointing: true
acceleration:
  mixed_precision_mode: "bf16"
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: true
data:
  preprocessed_data_root: "/Volumes/cornell_catalog/cornell_schema/blob_video/Generator is the tracker/ltx_ds/phase2_train/.precomputed"
  num_dataloader_workers: 2
validation:
